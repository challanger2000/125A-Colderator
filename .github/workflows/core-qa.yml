name: Colderator Windows Core QA

on:
  push:
    branches:
      - v0.1.0
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Frozen Sources
        uses: actions/cache@v4
        with:
          path: build/frozen-source-cache
          key: colderator-frozen-sources-${{ hashFiles('assets/frozen_sources.json') }}

      - name: Cache Real Audio Fixtures
        uses: actions/cache@v4
        with:
          path: build/real-fixture-cache
          key: colderator-real-fixtures-${{ hashFiles('assets/real_fixtures.json') }}

      - name: Prepare licensed Frozen Sources
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy soundfile av
          python tools/prepare_frozen_sources.py
          python tools/prepare_real_fixtures.py

      - name: Configure
        shell: pwsh
        run: |
          cmake --version
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build plugin tests and validator
        shell: pwsh
        run: |
          cmake --build build --config Release --target Colderator ColderatorMeasurements ColderatorRealFixtureMeasurements ColderatorListeningRender validator --parallel

      - name: Cold Core measurements
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Render Listening Pack
        shell: pwsh
        run: |
          $renderer = Get-ChildItem -Path build -Recurse -File -Filter "ColderatorListeningRender.exe" | Select-Object -First 1
          if (-not $renderer) { Write-Error "ColderatorListeningRender.exe not found"; exit 1 }
          New-Item -ItemType Directory -Force -Path listening-pack | Out-Null
          & $renderer.FullName "listening-pack"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wavCount = (Get-ChildItem -Path listening-pack -File -Filter "*.wav").Count
          if ($wavCount -ne 48) { Write-Error "Expected 48 WAV files, got $wavCount"; exit 1 }

      - name: Locate VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "Colderator.vst3" | Select-Object -First 1
          if (-not $plugin) { Write-Error "Colderator.vst3 not found"; exit 1 }
          New-Item -ItemType Directory -Force -Path packaged | Out-Null
          Copy-Item -Path $plugin.FullName -Destination "packaged\125A Colderator.vst3" -Recurse -Force

          $archDir = "packaged\125A Colderator.vst3\Contents\x86_64-win"
          $oldBinary = Join-Path $archDir "Colderator.vst3"
          if (Test-Path $oldBinary) {
            Rename-Item -Path $oldBinary -NewName "125A Colderator.vst3"
          }

      - name: Steinberg Validator
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path packaged -Directory -Filter "125A Colderator.vst3" | Select-Object -First 1
          $validator = Get-ChildItem -Path build -Recurse -File -Filter "validator.exe" | Select-Object -First 1
          if (-not $plugin) { Write-Error "Packaged Colderator not found"; exit 1 }
          if (-not $validator) { Write-Error "validator.exe not found"; exit 1 }
          & $validator.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Colderator-v0.1.0-Core
          path: packaged/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Listening Pack
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Colderator-Listening-Pack
          path: listening-pack/
          if-no-files-found: error
          retention-days: 7
